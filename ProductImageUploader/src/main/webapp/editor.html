<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Product Image Upload Editor</title>
<script type="text/javascript" src="js/knockout-3.5.1.js"></script>
<script type="text/javascript" src="js/jquery-3.7.1.min.js"></script>
<style>
li {
	display: inline-block;
}
</style>
</head>
<body>
<div style="max-width: 75%%; height: 768px; float: left;">
	<img alt="uploadedImage" data-bind="attr:{src: imgSrc}" style="max-width: 100%%; max-height: 100%%; border: 1px solid black;">
</div>
<div style="float: left; width: 20%%; height: 768px; margin-left: 5px; border: 1px solid black;" >
<form data-bind="submit: applyUpdatesToUploadedImage">
	<div>
		<label for="textSize">Text Size</label>
		<ul style="list-style-type: none;">
		    <li><input type="radio" name="textSize" value="none" data-bind="checked: textSize" />None</li>
			<li><input type="radio" name="textSize" value="+1" data-bind="checked: textSize" />+1</li>
	    	<li><input type="radio" name="textSize" value="+2" data-bind="checked: textSize" />+2</li>
	    	<li><input type="radio" name="textSize" value="+3" data-bind="checked: textSize" />+3</li>
	    	<li><input type="radio" name="textSize" value="-1" data-bind="checked: textSize" />-1</li>
	    	<li><input type="radio" name="textSize" value="-2" data-bind="checked: textSize" />-2</li>
	    	<li><input type="radio" name="textSize" value="-3" data-bind="checked: textSize" />-3</li>
    	</ul>
	</div>
	<div>
		<label for="qrSize">QR Size</label>
		<ul style="list-style-type: none;">
		    <li><input type="radio" name="qrSize" value="none" data-bind="checked: qrSize" />None</li>
			<li><input type="radio" name="qrSize" value="+1" data-bind="checked: qrSize" />+1</li>
	    	<li><input type="radio" name="qrSize" value="+2" data-bind="checked: qrSize" />+2</li>
	    	<li><input type="radio" name="qrSize" value="+3" data-bind="checked: qrSize" />+3</li>
	    	<li><input type="radio" name="qrSize" value="-1" data-bind="checked: qrSize" />-1</li>
	    	<li><input type="radio" name="qrSize" value="-2" data-bind="checked: qrSize" />-2</li>
	    	<li><input type="radio" name="qrSize" value="-3" data-bind="checked: qrSize" />-3</li>
    	</ul>
	</div>
	<div>
		<label for="borderWidth">Border Width</label>
		<ul style="list-style-type: none;">
		    <li><input type="radio" name="borderWidth" value="none" data-bind="checked: borderWidth" />None</li>
			<li><input type="radio" name="borderWidth" value="+1" data-bind="checked: borderWidth" />+1</li>
	    	<li><input type="radio" name="borderWidth" value="+2" data-bind="checked: borderWidth" />+2</li>
	    	<li><input type="radio" name="borderWidth" value="+3" data-bind="checked: borderWidth" />+3</li>
	    	<li><input type="radio" name="borderWidth" value="-1" data-bind="checked: borderWidth" />-1</li>
	    	<li><input type="radio" name="borderWidth" value="-2" data-bind="checked: borderWidth" />-2</li>
	    	<li><input type="radio" name="borderWidth" value="-3" data-bind="checked: borderWidth" />-3</li>
    	</ul>
	</div>
	<div>
		<label for="topBorderHeight">Top Border Height</label>
		<ul style="list-style-type: none;">
		    <li><input type="radio" name="topBorderHeight" value="none" data-bind="checked: topBorderHeight" />None</li>
			<li><input type="radio" name="topBorderHeight" value="+1" data-bind="checked: topBorderHeight" />+1</li>
	    	<li><input type="radio" name="topBorderHeight" value="+2" data-bind="checked: topBorderHeight" />+2</li>
	    	<li><input type="radio" name="topBorderHeight" value="+3" data-bind="checked: topBorderHeight" />+3</li>
	    	<li><input type="radio" name="topBorderHeight" value="-1" data-bind="checked: topBorderHeight" />-1</li>
	    	<li><input type="radio" name="topBorderHeight" value="-2" data-bind="checked: topBorderHeight" />-2</li>
	    	<li><input type="radio" name="topBorderHeight" value="-3" data-bind="checked: topBorderHeight" />-3</li>
    	</ul>
	</div>
	<div>
		<label for="bottomBorderHeight">Bottom Border Height</label>
		<ul style="list-style-type: none;">
		    <li><input type="radio" name="bottomBorderHeight" value="none" data-bind="checked: bottomBorderHeight" />None</li>
			<li><input type="radio" name="bottomBorderHeight" value="+1" data-bind="checked: bottomBorderHeight" />+1</li>
	    	<li><input type="radio" name="bottomBorderHeight" value="+2" data-bind="checked: bottomBorderHeight" />+2</li>
	    	<li><input type="radio" name="bottomBorderHeight" value="+3" data-bind="checked: bottomBorderHeight" />+3</li>
	    	<li><input type="radio" name="bottomBorderHeight" value="-1" data-bind="checked: bottomBorderHeight" />-1</li>
	    	<li><input type="radio" name="bottomBorderHeight" value="-2" data-bind="checked: bottomBorderHeight" />-2</li>
	    	<li><input type="radio" name="bottomBorderHeight" value="-3" data-bind="checked: bottomBorderHeight" />-3</li>
    	</ul>
	</div>
	
	<input type="submit" value="Apply" >
	</form>
	
	<button data-bind="click: saveUploadedImage" style="margin-top: 200px">Save</button>
</div>
<script type="text/javascript">
function UploadedImageEditor() {
	
	var self = this;
	
	this.uploadedImageSessionId = %s;
	
	this.origImgSrc = "getUploadedImage?uploadedImageSessionId=" + this.uploadedImageSessionId;
	this.imgSrc = ko.observable(self.origImgSrc);
	
	this.textSize = ko.observable("");
	this.qrSize = ko.observable("");
	this.borderWidth = ko.observable("");
	this.topBorderHeight = ko.observable("");
	this.bottomBorderHeight = ko.observable("");
	
	this.num = 0;
	
	this.applyUpdatesToUploadedImage = function() {
		$.post("editUploadedImage", 
			   {uploadedImageSessionId: self.uploadedImageSessionId,
                textSize: self.textSize(),
                qrSize: self.qrSize(),
                borderWidth: self.borderWidth(),
                topBorderHeight: self.topBorderHeight(),
                bottomBorderHeight: self.bottomBorderHeight()},
			   function(returnedData) {
					
                	self.num += 1;
					self.imgSrc(self.origImgSrc + "&d=" + self.num );
               }
        );
	};
	
	this.saveUploadedImage = function() {
		$.get("saveUploadedImage", {id: self.uploadedImageSessionId},
			  function(returnedData) {
                  alert(returnedData);
                  if (returnedData === "Saved successfully!") {
					  window.location = "index.html";
                  }
			});
	}

}

let uploadImageEditor = new UploadedImageEditor();
ko.applyBindings(uploadImageEditor);

</script>
</body>
</html>
